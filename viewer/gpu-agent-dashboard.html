<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Agent Dashboard - pxOS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00ff88; margin-bottom: 10px; }
        h2 { color: #00aaff; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .panel {
            background: #12121a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #1a1a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }
        
        .stat-label {
            color: #888;
            font-size: 0.8em;
        }
        
        button {
            background: #1a1a3a;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            margin: 5px;
        }
        
        button:hover {
            background: #2a2a4a;
            border-color: #00ff88;
        }
        
        button.active {
            background: #00ff88;
            color: #000;
        }
        
        button.danger {
            border-color: #ff4444;
        }
        
        button.danger:hover {
            background: #ff4444;
        }
        
        .glyph-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        
        .glyph-btn {
            font-size: 1.5em;
            padding: 10px;
            text-align: center;
        }
        
        .glyph-btn.selected {
            background: #00ff88;
            color: #000;
        }
        
        #circuit-editor {
            width: 100%;
            height: 200px;
            background: #0a0a12;
            border: 1px solid #333;
            color: #00ff88;
            font-family: inherit;
            padding: 10px;
            resize: vertical;
        }
        
        #scan-output {
            background: #0a0a12;
            border: 1px solid #333;
            padding: 10px;
            white-space: pre;
            font-size: 0.9em;
            overflow: auto;
            max-height: 300px;
        }
        
        .templates-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        
        .template-btn {
            background: #1a1a3a;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .template-btn:hover {
            background: #2a2a5a;
        }
        
        .log {
            font-size: 0.85em;
            color: #888;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 10px;
        }
        
        .log-entry {
            margin: 3px 0;
        }
        
        .log-entry.error { color: #ff4444; }
        .log-entry.success { color: #00ff88; }
        .log-entry.info { color: #00aaff; }
        
        .row { margin: 10px 0; }
        label { color: #888; margin-right: 10px; }
        input[type="number"] {
            width: 80px;
            background: #1a1a2a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 5px;
            border-radius: 3px;
        }
        
        .heatmap-legend {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            font-size: 0.8em;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>🎮 GPU Agent Dashboard</h1>
    <p>Control the computational universe from your browser</p>
    
    <div class="stats">
        <div class="stat-box">
            <div class="stat-value" id="stat-status">●</div>
            <div class="stat-label">Status</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-pixels">0</div>
            <div class="stat-label">Active Pixels</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-fps">0</div>
            <div class="stat-label">FPS</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-frames">0</div>
            <div class="stat-label">Frames</div>
        </div>
    </div>
    
    <div class="grid">
        <div class="panel">
            <h2>Agent Control</h2>
            <button id="btn-start" onclick="startAgent()">▶ Start Agent</button>
            <button id="btn-stop" onclick="stopAgent()" class="danger">■ Stop Agent</button>
            <button onclick="clearUniverse()">🗑 Clear</button>
            
            <h3>Inject Glyph</h3>
            <div class="row">
                <label>X:</label>
                <input type="number" id="inject-x" value="100">
                <label>Y:</label>
                <input type="number" id="inject-y" value="100">
            </div>
            <div class="glyph-grid" id="glyph-grid"></div>
            
            <h3>Draw Wire</h3>
            <div class="row">
                <label>From:</label>
                <input type="number" id="wire-x1" value="50">
                <input type="number" id="wire-y1" value="50">
                <label>To:</label>
                <input type="number" id="wire-x2" value="200">
                <input type="number" id="wire-y2" value="50">
                <button onclick="drawWire()">Draw</button>
            </div>
            
            <h3>Logic Gates</h3>
            <button onclick="placeGate('and')">AND Gate</button>
            <button onclick="placeGate('xor')">XOR Gate</button>
            <div class="row">
                <label>At:</label>
                <input type="number" id="gate-x" value="150">
                <input type="number" id="gate-y" value="100">
            </div>
        </div>
        
        <div class="panel">
            <h2>Circuit Templates</h2>
            <div class="templates-list" id="templates-list"></div>
            
            <h3>Load Position</h3>
            <div class="row">
                <label>X:</label>
                <input type="number" id="template-x" value="100">
                <label>Y:</label>
                <input type="number" id="template-y" value="50">
            </div>
            
            <h3>Custom Circuit (ASCII)</h3>
            <textarea id="circuit-editor" placeholder="Type ASCII circuit here...
- = wire
& = AND gate
X = XOR gate
* = replicator
+ = signal"></textarea>
            <button onclick="loadCustomCircuit()">Load Circuit</button>
            <button onclick="scanRegion()">Scan Region</button>
        </div>
    </div>
    
    <div class="panel" style="margin-top: 20px;">
        <h2>Scan Output</h2>
        <div class="heatmap-legend">
            <div class="legend-item"><div class="legend-color" style="background: #00ff00"></div> Wire</div>
            <div class="legend-item"><div class="legend-color" style="background: #00ffff"></div> AND</div>
            <div class="legend-item"><div class="legend-color" style="background: #ff00ff"></div> XOR</div>
            <div class="legend-item"><div class="legend-color" style="background: #ffff00"></div> Replicate</div>
            <div class="legend-item"><div class="legend-color" style="background: #ffffff"></div> Signal</div>
        </div>
        <div id="scan-output">No scan yet...</div>
    </div>
    
    <div class="log" id="log"></div>
    
    <script>
        const API = 'http://localhost:3839/api/v1';
        let selectedGlyph = '*';
        let isAgentRunning = false;
        
        const GLYPHS = [
            { char: '-', name: 'Wire H', opcode: 0x01 },
            { char: '|', name: 'Wire V', opcode: 0x02 },
            { char: '&', name: 'AND', opcode: 0x04 },
            { char: 'X', name: 'XOR', opcode: 0x05 },
            { char: '*', name: 'Repl', opcode: 0x07 },
            { char: '@', name: 'Infect', opcode: 0x08 },
            { char: '+', name: 'Signal', opcode: 0x10 },
            { char: '!', name: 'Sleep', opcode: 0x11 },
            { char: '>', name: 'Right', opcode: 0x12 },
            { char: '<', name: 'Left', opcode: 0x13 },
            { char: '^', name: 'Up', opcode: 0x14 },
            { char: 'v', name: 'Down', opcode: 0x15 },
        ];
        
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        async function api(endpoint, options = {}) {
            try {
                const res = await fetch(`${API}${endpoint}`, {
                    ...options,
                    headers: { 'Content-Type': 'application/json' }
                });
                return await res.json();
            } catch (err) {
                log(`API Error: ${err.message}`, 'error');
                throw err;
            }
        }
        
        async function startAgent() {
            log('Starting GPU agent...');
            const result = await api('/gpu/agent/start', { method: 'POST' });
            if (result.started || result.alreadyRunning) {
                isAgentRunning = true;
                document.getElementById('stat-status').textContent = '● Running';
                document.getElementById('stat-status').style.color = '#00ff88';
                log('GPU agent started', 'success');
                pollStats();
            }
        }
        
        async function stopAgent() {
            log('Stopping GPU agent...');
            const result = await api('/gpu/agent/stop', { method: 'POST' });
            isAgentRunning = false;
            document.getElementById('stat-status').textContent = '○ Stopped';
            document.getElementById('stat-status').style.color = '#888';
            log('GPU agent stopped');
        }
        
        async function pollStats() {
            if (!isAgentRunning) return;
            
            try {
                const stats = await api('/gpu/agent/stats');
                document.getElementById('stat-pixels').textContent = stats.activePixels || 0;
                document.getElementById('stat-fps').textContent = stats.fps || 0;
                document.getElementById('stat-frames').textContent = stats.frameCount || 0;
            } catch (err) {}
            
            setTimeout(pollStats, 1000);
        }
        
        async function injectGlyph() {
            const x = parseInt(document.getElementById('inject-x').value);
            const y = parseInt(document.getElementById('inject-y').value);
            const glyph = GLYPHS.find(g => g.char === selectedGlyph);
            
            log(`Injecting '${selectedGlyph}' at (${x}, ${y})...`);
            const result = await api('/gpu/inject', {
                method: 'POST',
                body: JSON.stringify({ x, y, opcode: glyph.opcode, r: 255, g: 255, b: 255 })
            });
            log(`Injected at (${x}, ${y})`, 'success');
        }
        
        async function drawWire() {
            const x1 = parseInt(document.getElementById('wire-x1').value);
            const y1 = parseInt(document.getElementById('wire-y1').value);
            const x2 = parseInt(document.getElementById('wire-x2').value);
            const y2 = parseInt(document.getElementById('wire-y2').value);
            
            log(`Drawing wire from (${x1}, ${y1}) to (${x2}, ${y2})...`);
            const result = await api('/gpu/wire', {
                method: 'POST',
                body: JSON.stringify({ x1, y1, x2, y2, color: '00FF00' })
            });
            log(`Drew wire: ${result.output || 'ok'}`, 'success');
        }
        
        async function placeGate(type) {
            const x = parseInt(document.getElementById('gate-x').value);
            const y = parseInt(document.getElementById('gate-y').value);
            
            log(`Placing ${type.toUpperCase()} gate at (${x}, ${y})...`);
            const result = await api('/gpu/gate', {
                method: 'POST',
                body: JSON.stringify({ type, x, y })
            });
            log(`Placed ${type.toUpperCase()} gate`, 'success');
        }
        
        async function loadTemplate(name) {
            const x = parseInt(document.getElementById('template-x').value);
            const y = parseInt(document.getElementById('template-y').value);
            
            log(`Loading template "${name}" at (${x}, ${y})...`);
            const result = await api('/gpu/circuit/load', {
                method: 'POST',
                body: JSON.stringify({ template: name, x, y })
            });
            log(`Loaded template: ${name}`, 'success');
        }
        
        async function loadCustomCircuit() {
            const ascii = document.getElementById('circuit-editor').value;
            const x = parseInt(document.getElementById('template-x').value);
            const y = parseInt(document.getElementById('template-y').value);
            
            log(`Loading custom circuit at (${x}, ${y})...`);
            const result = await api('/gpu/circuit/load', {
                method: 'POST',
                body: JSON.stringify({ ascii, x, y })
            });
            log(`Loaded custom circuit`, 'success');
        }
        
        async function scanRegion() {
            const x = parseInt(document.getElementById('template-x').value);
            const y = parseInt(document.getElementById('template-y').value);
            
            log(`Scanning region at (${x}, ${y})...`);
            const result = await api(`/gpu/circuit/scan?x=${x}&y=${y}&width=80&height=24`);
            
            const outputEl = document.getElementById('scan-output');
            if (result.ascii) {
                outputEl.textContent = result.ascii;
            } else {
                outputEl.textContent = result.raw || JSON.stringify(result, null, 2);
            }
            log('Scan complete', 'success');
        }
        
        async function clearUniverse() {
            log('Clearing universe...');
            // Clear by injecting empty space across the grid
            // For now, just restart the agent
            log('Universe cleared (restart agent to apply)');
        }
        
        function initGlyphGrid() {
            const grid = document.getElementById('glyph-grid');
            GLYPHS.forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'glyph-btn';
                btn.textContent = g.char;
                btn.title = g.name;
                if (g.char === selectedGlyph) btn.classList.add('selected');
                btn.onclick = () => {
                    document.querySelectorAll('.glyph-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedGlyph = g.char;
                };
                btn.ondblclick = () => injectGlyph();
                grid.appendChild(btn);
            });
        }
        
        async function loadTemplates() {
            try {
                const result = await api('/gpu/circuit/templates');
                const list = document.getElementById('templates-list');
                result.templates.forEach(name => {
                    const btn = document.createElement('div');
                    btn.className = 'template-btn';
                    btn.textContent = name;
                    btn.onclick = () => loadTemplate(name);
                    list.appendChild(btn);
                });
            } catch (err) {
                log('Could not load templates', 'error');
            }
        }
        
        // Initialize
        initGlyphGrid();
        loadTemplates();
        log('Dashboard ready');
    </script>
</body>
</html>
